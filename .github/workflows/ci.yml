name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # A real CockroachDB, because the tests check real transaction behaviour.
      # Started by hand, not with `services:`: that block cannot pass a command, and this image
      # needs `start-single-node --insecure` (without it the container exits immediately).
      - name: Start CockroachDB
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:v25.4.18 \
            start-single-node --insecure --store=type=mem,size=25%
          for i in $(seq 1 30); do
            if docker exec cockroach cockroach sql --insecure -e "SELECT 1" >/dev/null 2>&1; then
              echo "CockroachDB ready"; exit 0
            fi
            sleep 2
          done
          docker logs cockroach
          echo "CockroachDB did not become ready" >&2
          exit 1
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
